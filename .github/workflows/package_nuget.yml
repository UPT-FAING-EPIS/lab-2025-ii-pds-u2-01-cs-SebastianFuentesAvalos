name: Build & Publish NuGet Package

on:
  push:
    tags: ['v*']

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore Bank/Bank.Domain/Bank.Domain.csproj

    - name: Build
      run: dotnet build Bank/Bank.Domain/Bank.Domain.csproj --configuration Release --no-restore

    - name: Pack
      run: dotnet pack Bank/Bank.Domain/Bank.Domain.csproj --configuration Release --no-build --output ./nupkg

    - name: Publish to GitHub Packages
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        for package in ./nupkg/*.nupkg
        do
          dotnet nuget push "$package" \
            --source "https://nuget.pkg.github.com/UPT-FAING-EPIS/index.json" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
        done